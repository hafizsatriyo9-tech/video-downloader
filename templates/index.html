<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Downloader Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
  <a href="/download" class="flex items-center gap-2 text-green-400 font-semibold">
  <img src="icon.png" alt="Download" class="w-6 h-6">
  Download Video
  </a>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen px-4">

<!-- FULL CLICK OVERLAY -->
<a
  id="globalAd"
  href="https://shopee.co.id"
  target="_blank"
  class="fixed inset-0 z-[9999]"
  style="display:none;"
></a>

<div class="bg-slate-800 p-6 rounded-xl shadow-xl w-full max-w-md z-10">

<h2 class="text-xl font-bold text-center mb-2">🚀 Video Downloader</h2>
<p class="text-center text-sm text-gray-400 mb-4">
TikTok • Instagram • X • YouTube
</p>

<form id="form" action="/download" method="post">

<input 
type="text" 
name="url"
required
placeholder="Paste video link..."
class="w-full p-3 rounded bg-slate-700 outline-none mb-3">

<select 
name="format"
class="w-full p-3 rounded bg-slate-700 mb-3">
<option value="mp4">MP4 Video</option>
<option value="mp3">MP3 Audio</option>
</select>

<button 
type="submit"
class="bg-green-500 hover:bg-green-600 w-full p-3 rounded font-bold">
Download
</button>

</form>

<!-- PROGRESS -->
<div id="progressBox" class="hidden mt-4">
<p class="text-sm mb-1">Downloading...</p>
<div class="w-full bg-slate-700 rounded">
<div id="bar" class="bg-green-500 h-3 rounded w-0"></div>
</div>
</div>

</div>

<script>
/* ===============================
   CLICK ANYWHERE ADS
================================ */

// GANTI LINK IKLAN DI SINI
const AD_LINK = "https://shopee.co.id";

// tampilkan hanya 1x per user
if (!sessionStorage.getItem("adClicked")) {
  const ad = document.getElementById("globalAd");
  ad.href = AD_LINK;

  // aktif setelah 3 detik
  setTimeout(() => {
    ad.style.display = "block";
  }, 3000);

  ad.addEventListener("click", () => {
    sessionStorage.setItem("adClicked", "true");
    ad.style.display = "none";
  });
}

/* ===============================
   PROGRESS BAR FAKE
================================ */
const form = document.getElementById("form");
const progressBox = document.getElementById("progressBox");
const bar = document.getElementById("bar");

form.addEventListener("submit", () => {
  progressBox.classList.remove("hidden");

  let width = 0;
  let loading = setInterval(() => {
    if (width >= 90) {
      clearInterval(loading);
    } else {
      width += 5;
      bar.style.width = width + "%";
    }
  }, 400);
});
</script>

</body>
</html>
