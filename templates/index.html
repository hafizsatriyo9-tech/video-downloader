<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Downloader</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

<div class="bg-gray-800 p-6 rounded-xl shadow-lg w-full max-w-md">

<h1 class="text-xl font-bold text-center mb-4">
Multi Video Downloader
</h1>

<input id="url" type="text" placeholder="Paste TikTok / IG / X / YouTube URL"
class="w-full p-3 rounded bg-gray-700 outline-none mb-3">

<select id="format" class="w-full p-3 rounded bg-gray-700 mb-3">
<option value="mp4">MP4 Video</option>
<option value="mp3">MP3 Audio</option>
</select>

<button onclick="startDownload()"
class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold">
Download
</button>

<div class="mt-4 hidden" id="progressBox">
<div class="w-full bg-gray-600 rounded">
<div id="bar" class="bg-green-500 text-xs p-1 rounded w-0%">0%</div>
</div>
</div>

</div>

<script>

async function startDownload() {

let url = document.getElementById("url").value;
let format = document.getElementById("format").value;

if(!url){
 alert("Masukkan URL dulu!");
 return;
}

document.getElementById("progressBox").classList.remove("hidden");

let res = await fetch("/download", {
 method: "POST",
 headers: {"Content-Type":"application/x-www-form-urlencoded"},
 body: `url=${encodeURIComponent(url)}&format=${format}`
});

let data = await res.json();

let task = data.task_id;
let file = data.file;

let timer = setInterval(async () => {

 let p = await fetch("/progress/" + task);
 let prog = await p.json();

 if(prog.progress >= 0){

 document.getElementById("bar").style.width = prog.progress + "%";
 document.getElementById("bar").innerText = Math.floor(prog.progress) + "%";

 }

 if(prog.progress >= 100){
 clearInterval(timer);
 window.location = "/getfile?path=" + file;
 }

 if(prog.progress == -1){
 clearInterval(timer);
 alert("Download gagal!");
 }

}, 1000);

}

</script>

</body>
</html>
