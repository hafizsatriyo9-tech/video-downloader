<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Downloader Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen px-4">

<div class="bg-slate-800 p-6 rounded-xl shadow-xl w-full max-w-md">

<h2 class="text-xl font-bold text-center mb-2">🚀 Video Downloader</h2>
<p class="text-center text-sm text-gray-400 mb-4">
TikTok • Instagram • X • YouTube
</p>

<form id="form" action="/download" method="post">

<input 
type="text" 
name="url"
required
placeholder="Paste video link..."
class="w-full p-3 rounded bg-slate-700 outline-none mb-3">

<select 
name="format"
class="w-full p-3 rounded bg-slate-700 mb-3">

<option value="mp4">MP4 Video</option>
<option value="mp3">MP3 Audio</option>

</select>

<button 
type="submit"
class="bg-green-500 hover:bg-green-600 w-full p-3 rounded font-bold">

Download

</button>

</form>

<!-- PROGRESS BAR -->
<div id="progressBox" class="hidden mt-4">

<p class="text-sm mb-1">Downloading...</p>

<div class="w-full bg-slate-700 rounded">
<div id="bar" class="bg-green-500 h-3 rounded w-0"></div>
</div>

</div>

</div>

<script>

const form = document.getElementById("form")
const progressBox = document.getElementById("progressBox")
const bar = document.getElementById("bar")

form.addEventListener("submit", () => {

progressBox.classList.remove("hidden")

let width = 0

let loading = setInterval(() => {
    if (width >= 90) {
        clearInterval(loading)
    } else {
        width += 5
        bar.style.width = width + "%"
    }
}, 400)

})

</script>

</body>
</html>
